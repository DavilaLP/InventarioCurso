name: CI Pipeline - InventarioCurso

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend-ci:
    name: Backend CI (Tests & Validación)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: inventario-eli-backend/package-lock.json

      - name: Instalar dependencias del Backend
        working-directory: inventario-eli-backend
        run: npm install

      - name: Ejecutar pruebas de integridad del Backend
        working-directory: inventario-eli-backend
        run: npm test

  frontend-ci:
    name: Frontend CI (Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: inventario-eli-frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        working-directory: inventario-eli-frontend
        run: npm install

      - name: Ejecutar pruebas unitarias del Frontend
        working-directory: inventario-eli-frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Compilar Frontend (Build de Producción)
        working-directory: inventario-eli-frontend
        run: CI=false npm run build

      - name: Guardar artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: inventario-eli-frontend/build
