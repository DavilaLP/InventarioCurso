name: CI InventarioCurso

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del backend
        working-directory: inventario-eli-backend
        run: npm install

      - name: Ejecutar pruebas del backend
        working-directory: inventario-eli-backend
        run: npm test --if-present

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del frontend
        working-directory: inventario-eli-frontend
        run: npm install

        - name: Ejecutar pruebas del frontend
        working-directory: inventario-eli-frontend
        run: npm test --if-present -- --passWithNoTests

      - name: Compilar frontend
        working-directory: inventario-eli-frontend
        run: npm run build --if-present
